# Profil "test" — H2 en mémoire, pour les tests d'intégration (B6).
# Activer avec @ActiveProfiles("test") dans les classes de test.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=create-drop autorisé hors production (B5 : interdit uniquement hors tests)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Pas de migrations Flyway sur H2 : le schéma est créé par Hibernate en test
spring.flyway.enabled=false
