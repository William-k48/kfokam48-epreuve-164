# Nom de l'application
spring.application.name=epreuve

# Port du serveur (imposé : 8085)
server.port=8085

# Base de données PostgreSQL (le host "postgres" est le nom du service dans docker-compose)
spring.datasource.url=jdbc:postgresql://postgres:5432/epreuve
spring.datasource.username=epreuve
spring.datasource.password=epreuve
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA — ddl-auto=validate (B5 : pas de update)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Gestion centralisée des erreurs : ne pas exposer les stack traces
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never