server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Issue #35 : relais de l'API vers le service backend du réseau Docker,
    # pour que le navigateur reste sur une seule origine (port 4200).
    location /api/ {
        proxy_pass http://backend:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}